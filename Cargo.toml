[workspace]
resolver = "2"
members = [
    "crates/meshlake-core",
    "crates/meshlake-cli",
    "crates/meshlake-controller",
    "crates/meshlake-gui",
    "crates/meshlake-relay",
    "crates/meshlake-root",
    "crates/meshlaked",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["MeshLake Contributors"]

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
eframe = "0.31"
fs2 = "0.4"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
ipnet = "2.11"
igd-next = "0.17"
libloading = "0.8"
libc = "0.2"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
webpki = { package = "rustls-webpki", version = "0.103", features = ["ring", "alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
sha2 = "0.10"
sha1 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "io-util"] }
tokio-rustls = "0.26"
tray-icon = "0.21"
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Rpc", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = "1.8"
