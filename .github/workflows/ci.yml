name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  windows:
    name: Windows workspace
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo +stable fmt --check

      - name: Run workspace tests
        run: cargo +stable test --workspace --locked

      - name: Build Windows release
        run: cargo +stable build --workspace --release --locked

      - name: Package Windows binaries
        shell: pwsh
        run: |
          ./scripts/release/New-MeshLakePackage.ps1 -Platform Windows -BinaryDirectory target/release -OutputDirectory ci-artifacts

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: MeshLake-Windows-x64
          path: |
            ci-artifacts/MeshLake-Windows-x64.zip
            ci-artifacts/MeshLake-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux core and services
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Run Linux tests
        run: >-
          cargo +stable test --locked
          -p meshlake-core
          -p meshlake-cli
          -p meshlake-controller
          -p meshlake-relay
          -p meshlake-root
          -p meshlaked

      - name: Build Linux release
        run: >-
          cargo +stable build --release --locked
          -p meshlake-cli
          -p meshlake-controller
          -p meshlake-relay
          -p meshlake-root
          -p meshlaked

      - name: Package Linux binaries
        shell: pwsh
        run: |
          ./scripts/release/New-MeshLakePackage.ps1 -Platform Linux -BinaryDirectory target/release -OutputDirectory ci-artifacts

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: MeshLake-Linux-x64
          path: |
            ci-artifacts/MeshLake-Linux-x64.tar.gz
            ci-artifacts/MeshLake-Linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
